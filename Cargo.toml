[package]
name = "gittre"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
clap = { version = "4.6.1", features = ["derive"] }
git2 = "0.21.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3.27.0"
