[package]
name = "gittre"
version = "0.1.11"
edition = "2024"
description = "A lean git review TUI: read diffs, comment, export to markdown"
repository = "https://github.com/AliciaSchep/gittre"

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
git2 = "0.21.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
